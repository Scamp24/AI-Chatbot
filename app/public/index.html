<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Chatbot</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; --page: #f5f5f7; --surface: rgba(255,255,255,.86); --solid: #fff; --text: #1d1d1f; --muted: #6e6e73; --border: #e5e5e7; --field: #d2d2d7; --soft: #f5f5f7; }
      :root.dark { color-scheme: dark; --page: #090a0c; --surface: rgba(28,29,33,.88); --solid: #1c1d21; --text: #f5f5f7; --muted: #a1a1a6; --border: #38393f; --field: #55565d; --soft: #27282d; }
      * { box-sizing: border-box; }
      body { margin: 0; background: radial-gradient(circle at 50% -20%, var(--solid) 0, var(--page) 55%); color: var(--text); transition: background .25s ease, color .25s ease; }
      header { display: flex; justify-content: space-between; align-items: center; max-width: 980px; margin: auto; padding: 1.25rem 1.25rem 0; }
      .brand { color: var(--text); text-decoration: none; font-weight: 700; letter-spacing: -.02em; }
      nav { display: flex; align-items: center; gap: 1rem; } nav a { color: var(--muted); text-decoration: none; font-size: .9rem; }
      .theme-toggle { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: .45rem .75rem; font: inherit; font-size: .8rem; cursor: pointer; }
      main { max-width: 1100px; min-height: calc(100vh - 86px); margin: 0 auto; padding: clamp(2.5rem, 8vh, 6rem) 1.25rem 3rem; display: grid; grid-template-columns: minmax(0, .9fr) minmax(360px, 1.1fr); align-items: center; gap: clamp(2rem, 7vw, 6rem); }
      .eyebrow { color: #6e6e73; font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      h1 { font-size: clamp(2.3rem, 6vw, 4.4rem); letter-spacing: -.065em; line-height: .98; margin: .75rem 0 1.25rem; }
      .lede { color: var(--muted); font-size: 1.1rem; line-height: 1.55; max-width: 600px; }
      .hero { align-self: center; } .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: clamp(1.25rem, 4vw, 2.25rem); box-shadow: 0 20px 50px #0000001a; backdrop-filter: blur(14px); }
      .connection { display: inline-flex; align-items: center; gap: .5rem; margin-top: 2rem; color: var(--muted); font-size: .9rem; } .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: #9a9a9f; } .connection-dot.connected { background: #2da44e; }
      label { display: block; font-weight: 650; margin: 1.25rem 0 .5rem; }
      textarea { width: 100%; border: 1px solid var(--field); border-radius: 12px; padding: .9rem; font: inherit; color: var(--text); background: var(--solid); min-height: 64px; resize: vertical; }
      textarea:focus { outline: 3px solid #0071e333; border-color: #0071e3; }
      button { margin-top: 1.25rem; background: #0071e3; color: white; border: 0; border-radius: 999px; padding: .8rem 1.35rem; font: inherit; font-weight: 650; cursor: pointer; }
      button:hover { background: #0077ed; }
      button:disabled { opacity: .6; cursor: wait; }
      #result { margin-top: 1.5rem; padding: 1rem 1.1rem; border-radius: 14px; background: var(--soft); white-space: pre-wrap; line-height: 1.5; }
      small { color: var(--muted); font-weight: 400; }
      @media (max-width: 760px) { main { display: block; min-height: auto; padding-top: 3rem; } .card { margin-top: 2rem; } nav a { margin-left: .5rem; } }
    </style>
  </head>
  <body>
    <header><a class="brand" href="/">AI Chatbot</a><nav><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme">Dark mode</button><a href="/admin">Admin portal</a></nav></header>
    <main>
      <section class="hero">
        <div class="eyebrow">Grounded answers</div>
        <h1>Ask with confidence.</h1>
        <p class="lede">Your connected knowledge is searched at answer time. The assistant only answers from evidence it can verify.</p>
        <div class="connection"><span id="connection-dot" class="connection-dot"></span><span id="connection-status">Checking knowledge connection…</span></div>
      </section>
      <section class="card">
        <form id="ask-form">
          <label for="question">Question</label>
          <textarea id="question" required minlength="3" maxlength="2000" rows="1" placeholder="Message the connected knowledge…"></textarea>
          <small>Press Enter to send. Use Shift + Enter for a new line.</small>
        </form>
        <div id="result" role="status" hidden></div>
      </section>
    </main>
    <script>
      const form = document.querySelector('#ask-form');
      const result = document.querySelector('#result');
      const themeToggle = document.querySelector('#theme-toggle');
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) document.documentElement.classList.add('dark');
      const updateThemeLabel = () => { const isDark = document.documentElement.classList.contains('dark'); themeToggle.textContent = isDark ? 'Light mode' : 'Dark mode'; themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode'); };
      themeToggle.addEventListener('click', () => { const isDark = document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', isDark ? 'dark' : 'light'); updateThemeLabel(); });
      updateThemeLabel();
      const question = document.querySelector('#question');
      const connectionStatus = document.querySelector('#connection-status');
      const connectionDot = document.querySelector('#connection-dot');
      fetch('/api/admin/google/status').then((response) => response.json()).then((status) => {
        if (status.connected) { connectionStatus.textContent = `Connected to Google Drive${status.email ? ` · ${status.email}` : ''}`; connectionDot.classList.add('connected'); }
        else if (status.configured) connectionStatus.textContent = 'Google Drive is ready to connect from Admin';
        else connectionStatus.textContent = 'No knowledge connection configured';
      }).catch(() => { connectionStatus.textContent = 'Knowledge connection unavailable'; });
      question.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        result.hidden = false;
        result.textContent = 'Searching connected knowledge…';
        try {
          const response = await fetch('/ask', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ question: question.value }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Request failed');
          const citations = data.answer.citations.map((citation) => `- ${citation.title} (${citation.documentId})`).join('\n');
          const diagnostic = data.sourceStatus?.error ? `\n\nConnection diagnostic: ${data.sourceStatus.error}` : '';
          result.textContent = `${data.answer.text}\n\n${data.answer.caveat || ''}${citations ? `\n\nCitations:\n${citations}` : ''}${diagnostic}`;
        } catch (error) {
          result.textContent = error instanceof Error ? error.message : 'Request failed';
        } finally {
        }
      });
    </script>
  </body>
</html>
